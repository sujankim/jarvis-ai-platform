<div class="shell"
     [class.shell--collapsed]="sidebarCollapsed()">

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="sidebar__brand">
      <div class="sidebar__logo">J</div>
      @if (!sidebarCollapsed()) {
        <span class="sidebar__name">Jarvis</span>
      }
    </div>

    <nav class="sidebar__nav">
      @for (item of navItems; track item.path) {
        <a
          class="nav-item"
          [routerLink]="item.path"
          routerLinkActive="nav-item--active"
          [title]="sidebarCollapsed()
            ? item.label : ''">
          <span class="material-symbols-rounded
                       nav-item__icon">
            {{ item.icon }}
          </span>
          @if (!sidebarCollapsed()) {
            <span class="nav-item__label">
              {{ item.label }}
            </span>
          }
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <div class="user-info">
        <div class="user-info__avatar">
          {{ displayName().charAt(0).toUpperCase() }}
        </div>
        @if (!sidebarCollapsed()) {
          <div class="user-info__details">
            <span class="user-info__name">
              {{ displayName() }}
            </span>
            <span class="user-info__role">
              {{ isAdmin() ? 'Admin' : 'User' }}
            </span>
          </div>
        }
      </div>

      <button
        class="logout-btn"
        (click)="logout()"
        [title]="sidebarCollapsed()
          ? 'Logout' : ''">
        <span class="material-symbols-rounded">
          logout
        </span>
        @if (!sidebarCollapsed()) {
          <span>Logout</span>
        }
      </button>
    </div>

  </aside>

  <!-- Main content -->
  <div class="main">

    <header class="topbar">
      <button
        class="topbar__toggle"
        (click)="toggleSidebar()"
        title="Toggle sidebar">
        <span class="material-symbols-rounded">
          {{ sidebarCollapsed()
          ? 'menu' : 'menu_open' }}
        </span>
      </button>

      <div class="topbar__right">

        <!-- Theme toggle -->
        <button
          class="topbar__theme-toggle"
          (click)="theme.toggle()"
          [title]="theme.isDark()
            ? 'Switch to light theme'
            : 'Switch to dark theme'">
          <span class="material-symbols-rounded">
            {{ theme.isDark()
            ? 'light_mode'
            : 'dark_mode' }}
          </span>
        </button>

        <span class="topbar__username">
          {{ username() }}
        </span>

      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>

  </div>

</div>
